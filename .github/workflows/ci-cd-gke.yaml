name: CI/CD – GKE

on:
  push:
    branches: [ main ]

env:
  PROJECT_ID: devops-gke-task
  REGION: us-central1
  REPO_NAME: hello-world-repo
  IMAGE_NAME: hello-world
  GKE_CLUSTER: gavclu-gke-1
  # ⚠️ CRITICAL FIX: Change to your ACTUAL cluster location (likely zonal)
  # Run: gcloud container clusters list --project devops-gke-task
  # Example values: us-central1-c (zonal) OR us-central1 (regional)
  GKE_LOCATION: us-central1 # ← MUST MATCH YOUR CLUSTER'S ACTUAL LOCATION

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'  # Required for Workload Identity Federation

    steps:
    - uses: actions/checkout@v4

    - name: Authenticate to Google Cloud (Workload Identity Federation)
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/250621052851/locations/global/workloadIdentityPools/github/providers/githubaction'
        service_account: 'github-cicd@devops-gke-task.iam.gserviceaccount.com'
        # ✅ REMOVED credentials_json – pure WIF is more secure than service account keys

    - name: Setup gcloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Debug - Verify cluster exists at specified location
      run: |
        echo "Checking cluster '${{ env.GKE_CLUSTER }}' in location '${{ env.GKE_LOCATION }}'..."
        gcloud container clusters list --project ${{ env.PROJECT_ID }} --filter="name=${{ env.GKE_CLUSTER }}" --format="table(name,location,status)"
        gcloud container clusters describe ${{ env.GKE_CLUSTER }} \
          --project ${{ env.PROJECT_ID }} \
          --location ${{ env.GKE_LOCATION }} \
          --format="value(status)" || exit 1

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    - name: Set Image Tag
      run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

    - name: Build Docker Image
      run: |
        docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

    - name: Trivy Scan
      uses: aquasecurity/trivy-action@0.24.0
      with:
        image-ref: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        severity: HIGH,CRITICAL
        exit-code: '1'  # Fail on vulnerabilities (changed from 0 for security)

    - name: Push Docker Image
      run: |
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

    - name: Get GKE Credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        project_id: ${{ env.PROJECT_ID }}
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GKE_LOCATION }}  # ← CORRECTED: Must match actual cluster location

    - name: Setup Helm
      uses: azure/setup-helm@v4

    - name: Deploy to GKE with Helm
      run: |
        helm upgrade --install hello-world ./helm/hello-world \
          --namespace default \
          --create-namespace \
          --set image.repository=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }} \
          --set image.tag=${{ env.IMAGE_TAG }}
