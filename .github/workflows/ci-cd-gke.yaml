name: CI/CD – GKE

on:
  push:
    branches: [ main ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  IMAGE_NAME: hello-world
  GKE_CLUSTER: primary-gke
  GKE_REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: gcloud auth configure-docker --quiet

    - name: Build Image
      run: |
        docker buildx build --tag gcr.io/devops-gke-task/${{ env.IMAGE_NAME }}:latest .
        
    - name: Trivy Scan
      uses: aquasecurity/trivy-action@0.20.0
      with:
        image-ref: gcr.io/${{ env.PROJECT_ID }}/{{ env.IMAGE_NAME }}:latest 
        severity: HIGH,CRITICAL
        exit-code: 1

    - name: Push Image
      run: |
        docker push gcr.io/devops-gke-task/$ {{ env.IMAGE_NAME }}:latest 

    - uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GKE_REGION }}

    - uses: azure/setup-helm@v4

    - name: Deploy with Helm
      run: |
        helm upgrade --install hello-world helm/hello-world \
          --set image.repository=gcr.io/devops-gke-task/$ {{ env.IMAGE_NAME }}
