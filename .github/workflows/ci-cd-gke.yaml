name: CI/CD – GKE

on:
  push:
    branches: [ main ]

env:
  PROJECT_ID: devops-gke-task
  REGION: us-central1
  REPO_NAME: hello-world-repo
  IMAGE_NAME: hello-world
  GKE_CLUSTER: gavclu-gke-1
  GKE_REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/250621052851/locations/global/workloadIdentityPools/github/providers/githubaction'
        service_account: 'github-cicd@devops-gke-task.iam.gserviceaccount.com'
              
    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
        
    - name: Set Image Tag
      run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV
      
    - name: Build Docker Image
      run: |
        docker build \
          -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
          .

    - name: Trivy Scan
      uses: aquasecurity/trivy-action@0.20.0
      with:
        image-ref: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        severity: HIGH,CRITICAL
        exit-code: 0
      
    - name: Push Docker Image
      run: |
        docker push \
          ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

    - name: Get GKE Credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: '${{ env.GKE_CLUSTER }}'
        location: '${{ env.GKE_REGION }}'
        project_id: '${{ env.PROJECT_ID }}'

    - name: Setup Helm
      uses: azure/setup-helm@v4
      
    - name: Deploy to GKE with Helm
      run: |
        helm upgrade --install hello-world helm/hello-world \
          --namespace default \
          --create-namespace \
          --set image.repository=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }} \
          --set image.tag=${{ env.IMAGE_TAG }}
